<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRMS — Student Records Management System</title>
<meta name="description" content="A web-based student records management system with real SQL running in the browser.">
<meta name="author" content="Samuel Tadele Refera">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: { DEFAULT: '#f5f7fa', soft: '#eef1f6' },
        surface: { DEFAULT: '#ffffff', soft: '#fafbfc' },
        line: { DEFAULT: '#e4e7ec', strong: '#d0d5dd' },
        ink: { DEFAULT: '#101828', soft: '#475467', muted: '#98a2b3', light: '#c4c9d4' },
        primary: { DEFAULT: '#4f46e5', dark: '#4338ca', soft: '#eef2ff', light: '#818cf8' },
        success: { DEFAULT: '#10b981', soft: '#ecfdf5', dark: '#059669' },
        warning: { DEFAULT: '#f59e0b', soft: '#fffbeb', dark: '#d97706' },
        danger:  { DEFAULT: '#ef4444', soft: '#fef2f2', dark: '#dc2626' }
      },
      fontFamily: {
        sans: ['Inter', 'system-ui', 'sans-serif'],
        mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
      }
    }
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root { color-scheme: light; }
  html { scroll-behavior: smooth; }
  body {
    background: #f5f7fa;
    color: #101828;
    font-family: 'Inter', system-ui, sans-serif;
    letter-spacing: -0.011em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  ::selection { background: #4f46e5; color: #ffffff; }

  /* ---------- Cards ---------- */
  .card {
    background: #ffffff;
    border: 1px solid #e4e7ec;
    border-radius: 12px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .card-hover:hover {
    border-color: #d0d5dd;
    box-shadow: 0 1px 3px rgba(16,24,40,0.06), 0 1px 2px rgba(16,24,40,0.04);
  }

  /* ---------- Nav items ---------- */
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: #475467;
    transition: all .15s ease;
  }
  .nav-item:hover {
    background: #f5f7fa;
    color: #101828;
  }
  .nav-item.active {
    background: #eef2ff;
    color: #4338ca;
    font-weight: 600;
  }
  .nav-item.active svg { color: #4f46e5; }

  /* ---------- Focus ring ---------- */
  :focus-visible {
    outline: 2px solid #4f46e5;
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ---------- Inputs ---------- */
  .input {
    width: 100%;
    background: #ffffff;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 13.5px;
    color: #101828;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input::placeholder { color: #98a2b3; }
  .input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    transition: all .15s ease;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: #4f46e5;
    color: #ffffff;
    box-shadow: 0 1px 2px rgba(16,24,40,0.05);
  }
  .btn-primary:hover { background: #4338ca; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

  .btn-secondary {
    background: #ffffff;
    color: #344054;
    border-color: #d0d5dd;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  .btn-secondary:hover { background: #f9fafb; border-color: #98a2b3; }

  .btn-danger {
    background: #ef4444;
    color: #ffffff;
  }
  .btn-danger:hover { background: #dc2626; }

  .btn-ghost {
    background: transparent;
    color: #475467;
    border-color: transparent;
  }
  .btn-ghost:hover { background: #f5f7fa; color: #101828; }

  /* ---------- Table ---------- */
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th { font-weight: 500; }

  /* ---------- Modal ---------- */
  .modal { display: none; }
  .modal.is-open { display: flex; }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.97); }
    to   { opacity: 1; transform: none; }
  }
  .modal-panel { animation: modalIn .2s ease; }

  /* ---------- Toast ---------- */
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  .toast { animation: toastIn .25s ease; }

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #f5f7fa; }
  ::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 5px; border: 2px solid #f5f7fa; }
  ::-webkit-scrollbar-thumb:hover { background: #98a2b3; }

  /* ---------- Status pill ---------- */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 6px;
    line-height: 1.5;
  }
  .pill-success { background: #ecfdf5; color: #059669; }
  .pill-warning { background: #fffbeb; color: #d97706; }
  .pill-danger  { background: #fef2f2; color: #dc2626; }
  .pill-primary { background: #eef2ff; color: #4338ca; }
  .pill-neutral { background: #f2f4f7; color: #475467; }

  /* ---------- Login screen background ---------- */
  .login-bg {
    background:
      radial-gradient(ellipse 60% 60% at 15% 10%, rgba(79,70,229,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 60% 60% at 85% 90%, rgba(16,185,129,0.08) 0%, transparent 55%),
      #f5f7fa;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading" class="fixed inset-0 flex items-center justify-center bg-bg z-50">
  <div class="text-center">
    <div class="w-10 h-10 border-2 border-line border-t-primary rounded-full animate-spin mx-auto"></div>
    <p class="mt-4 text-sm text-ink-muted font-mono">Initializing SQL engine…</p>
  </div>
</div>

<!-- Login -->
<div id="loginScreen" class="hidden fixed inset-0 login-bg items-center justify-center p-6 z-40">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center mx-auto mb-5 shadow-lg shadow-primary/20">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
          <ellipse cx="12" cy="6" rx="8" ry="3"/>
          <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
          <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-ink">Student Records System</h1>
      <p class="text-sm text-ink-soft mt-2">Sign in to continue</p>
    </div>

    <form id="loginForm" class="card p-7 space-y-4 shadow-sm">
      <div>
        <label class="block text-[11px] font-mono uppercase tracking-widest text-ink-muted mb-2">Username</label>
        <input id="loginUser" type="text" required autocomplete="username" class="input">

      <div>

      </div>

    </form>

    <div class="mt-6 card p-4 bg-surface-soft">
      <div class="text-[11px] font-mono uppercase tracking-widest text-ink-muted mb-3">Demo accounts</div>
      <div class="space-y-1.5">
        <button type="button" data-fill="admin:admin123" class="w-full flex justify-between items-center px-3 py-2 rounded-md hover:bg-bg transition-colors text-left">
          <span class="text-[13px] text-ink-soft font-mono">admin / admin123</span>
          <span class="pill pill-warning">Admin</span>
        </button>
        <button type="button" data-fill="teacher:teach123" class="w-full flex justify-between items-center px-3 py-2 rounded-md hover:bg-bg transition-colors text-left">
          <span class="text-[13px] text-ink-soft font-mono">teacher / teach123</span>
          <span class="pill pill-primary">Teacher</span>
        </button>
        <button type="button" data-fill="viewer:view123" class="w-full flex justify-between items-center px-3 py-2 rounded-md hover:bg-bg transition-colors text-left">
          <span class="text-[13px] text-ink-soft font-mono">viewer / view123</span>
          <span class="pill pill-neutral">Viewer</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- App shell -->
<div id="app" class="hidden min-h-screen">

  <!-- Sidebar -->
  <aside class="fixed top-0 left-0 bottom-0 w-60 bg-surface border-r border-line flex flex-col z-30">
    <div class="h-16 flex items-center px-5 border-b border-line">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center flex-shrink-0 shadow-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
          <ellipse cx="12" cy="6" rx="8" ry="3"/>

    </div>

    <nav id="nav" class="flex-1 py-4 px-3 space-y-0.5 overflow-y-auto"></nav>

    <div class="p-3 border-t border-line">
      <div id="userCard"></div>
    </div>
  </aside>

  <div class="ml-60">
    <header class="h-16 border-b border-line bg-surface/90 backdrop-blur-md sticky top-0 z-20">

        <div class="flex items-center gap-3">
          <button id="resetDbBtn" class="btn btn-ghost !text-[12px] !px-3 !py-1.5">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>

    <main id="main" class="p-6 lg:p-8 max-w-[1400px]"></main>

</div>

<div id="modalRoot" class="modal fixed inset-0 z-40 bg-ink/40 backdrop-blur-sm items-center justify-center p-4"></div>
<div id="toastRoot" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

<script>
/* ============================================================================
   SRMS — Student Records Management System
   Light SaaS-style UI · Real SQL via SQL.js
   ============================================================================ */

const DB = {
  sql: null,
  db: null,
  STORAGE_KEY: 'srms_db_v2',

  async init() {
    this.sql = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });

    const saved = localStorage.getItem(this.STORAGE_KEY);
    if (saved) {
      try {
        const bytes = Uint8Array.from(JSON.parse(saved));
        this.db = new this.sql.Database(bytes);
        const userCount = this.db.exec('SELECT COUNT(*) FROM users')[0].values[0][0];
        if (userCount > 0) return;
        console.warn('Saved DB has no users — reseeding.');
        localStorage.removeItem(this.STORAGE_KEY);
      } catch (e) {
        console.warn('Saved DB invalid, reseeding.', e);
        localStorage.removeItem(this.STORAGE_KEY);
      }
    }

    this.db = new this.sql.Database();
    await this.seed();
    this.save();
  },

  async seed() {
    this.db.run(`
      PRAGMA foreign_keys = ON;

      CREATE TABLE departments (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        code TEXT UNIQUE NOT NULL,
        name TEXT NOT NULL
      );

      CREATE TABLE students (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        student_id TEXT UNIQUE NOT NULL,
        first_name TEXT NOT NULL,
        last_name TEXT NOT NULL,
        email TEXT UNIQUE NOT NULL,
        phone TEXT,
        department_id INTEGER NOT NULL,
        year INTEGER NOT NULL CHECK (year BETWEEN 1 AND 5),
        enrolled_date TEXT NOT NULL,
        status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','graduated','suspended')),
        FOREIGN KEY (department_id) REFERENCES departments(id)
      );

      CREATE TABLE courses (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        code TEXT UNIQUE NOT NULL,
        title TEXT NOT NULL,
        department_id INTEGER NOT NULL,
        credits INTEGER NOT NULL CHECK (credits BETWEEN 1 AND 6),
        semester TEXT NOT NULL,
        FOREIGN KEY (department_id) REFERENCES departments(id)
      );

      CREATE TABLE enrollments (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        student_id INTEGER NOT NULL,
        course_id INTEGER NOT NULL,
        enrolled_at TEXT NOT NULL,
        grade REAL CHECK (grade IS NULL OR (grade >= 0 AND grade <= 100)),
        letter_grade TEXT,
        UNIQUE(student_id, course_id),
        FOREIGN KEY (student_id) REFERENCES students(id) ON DELETE CASCADE,
        FOREIGN KEY (course_id) REFERENCES courses(id) ON DELETE CASCADE
      );

      CREATE TABLE attendance (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        enrollment_id INTEGER NOT NULL,
        date TEXT NOT NULL,
        status TEXT NOT NULL CHECK (status IN ('present','absent','late','excused')),
        UNIQUE(enrollment_id, date),
        FOREIGN KEY (enrollment_id) REFERENCES enrollments(id) ON DELETE CASCADE
      );

      CREATE TABLE users (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        username TEXT UNIQUE NOT NULL,
        password_hash TEXT NOT NULL,
        role TEXT NOT NULL CHECK (role IN ('admin','teacher','viewer')),
        display_name TEXT NOT NULL
      );

      CREATE INDEX idx_students_dept ON students(department_id);
      CREATE INDEX idx_enrollments_student ON enrollments(student_id);
      CREATE INDEX idx_enrollments_course ON enrollments(course_id);
      CREATE INDEX idx_attendance_enrollment ON attendance(enrollment_id);
    `);

    const departments = [
      ['CS', 'Computer Science'],
      ['IT', 'Information Technology'],
      ['SE', 'Software Engineering'],
      ['IS', 'Information Systems'],
    ];
    departments.forEach(d => this.db.run('INSERT INTO departments (code, name) VALUES (?, ?)', d));

    const students = [
      ['STU-2024-001', 'Abebe',    'Bekele',     'abebe.bekele@student.edu',     '+251911000001', 1, 2, '2024-09-01'],
      ['STU-2024-002', 'Sara',     'Tadesse',    'sara.tadesse@student.edu',     '+251911000002', 2, 2, '2024-09-01'],
      ['STU-2024-003', 'Dawit',    'Haile',      'dawit.haile@student.edu',      '+251911000003', 3, 3, '2023-09-01'],
      ['STU-2024-004', 'Hana',     'Girma',      'hana.girma@student.edu',       '+251911000004', 1, 2, '2024-09-01'],
      ['STU-2024-005', 'Yohannes', 'Tesfaye',    'yohannes.tesfaye@student.edu', '+251911000005', 4, 1, '2025-09-01'],
      ['STU-2024-006', 'Meron',    'Assefa',     'meron.assefa@student.edu',     '+251911000006', 2, 3, '2023-09-01'],
      ['STU-2024-007', 'Samuel',   'Tadele',     'samuel.tadele@student.edu',    '+251911000007', 3, 4, '2022-09-01'],
      ['STU-2024-008', 'Ruth',     'Mekonnen',   'ruth.mekonnen@student.edu',    '+251911000008', 1, 1, '2025-09-01'],
      ['STU-2024-009', 'Kalkidan', 'Alemayehu',  'kalkidan.a@student.edu',       '+251911000009', 4, 2, '2024-09-01'],
      ['STU-2024-010', 'Bereket',  'Solomon',    'bereket.solomon@student.edu',  '+251911000010', 3, 4, '2022-09-01'],
    ];
    students.forEach(s => this.db.run(
      'INSERT INTO students (student_id, first_name, last_name, email, phone, department_id, year, enrolled_date) VALUES (?,?,?,?,?,?,?,?)', s
    ));

    const courses = [
      ['WDD-101', 'Web Design Fundamentals',          1, 3, '2024-Fall'],
      ['WDD-102', 'HTML5 & CSS3',                     1, 3, '2024-Fall'],
      ['WDD-201', 'JavaScript Programming',           1, 4, '2025-Spring'],
      ['WDD-202', 'Database Design & SQL',            1, 4, '2025-Spring'],
      ['WDD-301', 'Server-Side Scripting',            3, 4, '2025-Fall'],
      ['WDD-302', 'Advanced Database Administration', 1, 4, '2025-Fall'],
      ['WDD-401', 'Web Application Security',         3, 3, '2025-Fall'],
      ['WDD-402', 'Capstone Project',                 1, 6, '2025-Fall'],
    ];
    courses.forEach(c => this.db.run(
      'INSERT INTO courses (code, title, department_id, credits, semester) VALUES (?,?,?,?,?)', c
    ));

    const grades = [
      [1, 1, 92], [1, 2, 88], [1, 3, 85],
      [2, 1, 78], [2, 2, 82], [2, 3, 75], [2, 4, 80],
      [3, 5, 91], [3, 6, 89], [3, 8, 94],
      [4, 1, 66], [4, 2, 72], [4, 4, 70],
      [5, 1, null], [5, 2, null],
      [6, 5, 87], [6, 6, 84], [6, 7, 79],
      [7, 5, 96], [7, 6, 95], [7, 7, 93], [7, 8, 97],
      [8, 1, null], [8, 2, null],
      [9, 3, 74], [9, 4, 68],
      [10, 7, 89], [10, 8, 92], [10, 5, 88],
    ];
    grades.forEach(g => {
      this.db.run(
        'INSERT INTO enrollments (student_id, course_id, enrolled_at, grade, letter_grade) VALUES (?,?,?,?,?)',
        [g[0], g[1], '2025-09-15', g[2], g[2] !== null ? this.letterGrade(g[2]) : null]
      );
    });

    const today = new Date();
    const dates = [];
    for (let i = 0; i < 6; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i * 7);
      dates.push(d.toISOString().slice(0, 10));
    }
    const statuses = ['present', 'present', 'late', 'present', 'absent', 'present'];
    const enrollIds = [];
    const res = this.db.exec('SELECT id FROM enrollments ORDER BY id');
    if (res[0]) res[0].values.forEach(v => enrollIds.push(v[0]));
    enrollIds.slice(0, 15).forEach((eid, i) => {
      dates.forEach((date, j) => {
        const status = statuses[(i + j) % statuses.length];
        this.db.run('INSERT OR IGNORE INTO attendance (enrollment_id, date, status) VALUES (?,?,?)', [eid, date, status]);
      });
    });

    const users = [
      ['admin',   'admin',   'admin123',  'admin',   'Administrator'],
      ['teacher', 'teacher', 'teach123',  'teacher', 'Instructor'],
      ['viewer',  'viewer',  'view123',   'viewer',  'Read-only Guest'],
    ];
    for (const u of users) {
      const hash = await Auth.hash(u[2], u[0]);
      this.db.run(
        'INSERT INTO users (username, password_hash, role, display_name) VALUES (?,?,?,?)',
        [u[0], hash, u[3], u[4]]
      );
    }
  },

  letterGrade(g) {
    if (g === null || g === undefined) return null;
    if (g >= 90) return 'A';
    if (g >= 80) return 'B';
    if (g >= 70) return 'C';
    if (g >= 60) return 'D';
    return 'F';
  },

  all(sql, params = []) {
    const stmt = this.db.prepare(sql);
    stmt.bind(params);
    const rows = [];
    while (stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
    return rows;
  },
  one(sql, params = []) { return this.all(sql, params)[0] || null; },
  run(sql, params = []) { this.db.run(sql, params); this.save(); },
  save() {
    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(Array.from(this.db.export())));
  },
  reset() {
    localStorage.removeItem(this.STORAGE_KEY);
    this.db = new this.sql.Database();
    return this.seed().then(() => this.save());
  },
  exec(sql) { return this.db.exec(sql); }
};

const Auth = {
  current: null,
  async hash(password, salt) {
    const data = new TextEncoder().encode(salt + '::' + password);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  async login(username, password) {
    const user = DB.one('SELECT * FROM users WHERE username = ?', [username]);
    if (!user) return { ok: false, error: 'User not found' };
    const hash = await this.hash(password, username);
    if (hash !== user.password_hash) return { ok: false, error: 'Incorrect password' };
    this.current = { id: user.id, username: user.username, role: user.role, name: user.display_name };
    return { ok: true };
  },
  logout() { this.current = null; },
  can(action) {
    if (!this.current) return false;
    const perms = {
      'students.create':  ['admin', 'teacher'],
      'students.edit':    ['admin', 'teacher'],
      'students.delete':  ['admin'],
      'courses.create':   ['admin', 'teacher'],
      'courses.edit':     ['admin', 'teacher'],
      'courses.delete':   ['admin'],
      'enrollments.create': ['admin', 'teacher'],
      'enrollments.grade':  ['admin', 'teacher'],
      'enrollments.delete': ['admin'],
      'attendance.mark':  ['admin', 'teacher'],
      'db.reset':         ['admin'],
    };
    return (perms[action] || []).includes(this.current.role);
  }
};

const UI = {
  escape(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  },
  toast(message, type = 'info') {
    const tones = {
      info:    'bg-white border-line text-ink',
      success: 'bg-success-soft border-success/30 text-success-dark',
      error:   'bg-danger-soft border-danger/30 text-danger-dark',
      warn:    'bg-warning-soft border-warning/30 text-warning-dark',
    };
    const icons = {
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h1v4h1"/>',
      success: '<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/>',
      error: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
      warn: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'
    };
    const el = document.createElement('div');
    el.className = `toast card ${tones[type]} px-4 py-3 text-[13.5px] font-medium max-w-xs shadow-lg flex items-start gap-2.5`;
    el.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 mt-0.5">${icons[type]}</svg><span>${UI.escape(message)}</span>`;
    document.getElementById('toastRoot').appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .3s, transform .3s';
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(() => el.remove(), 300);
    }, 3200);
  },
  modal({ title, body, footer, onMount, wide }) {
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-panel card w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[88vh] overflow-y-auto shadow-xl">
        <div class="flex items-center justify-between p-5 border-b border-line">
          <h2 class="text-[15px] font-semibold text-ink">${UI.escape(title)}</h2>
          <button data-close aria-label="Close" class="w-8 h-8 rounded-md text-ink-muted hover:text-ink hover:bg-bg flex items-center justify-center transition-colors">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="p-5">${body}</div>
        ${footer ? `<div class="p-5 border-t border-line bg-surface-soft flex justify-end gap-2">${footer}</div>` : ''}
      </div>
    `;
    root.classList.add('is-open');
    root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', UI.closeModal));
    root.addEventListener('mousedown', e => { if (e.target === root) UI.closeModal(); });
    if (onMount) onMount(root);
  },
  closeModal() {
    const root = document.getElementById('modalRoot');
    root.classList.remove('is-open');
    root.innerHTML = '';
  },
  confirm(message, onConfirm) {
    UI.modal({
      title: 'Confirm action',
      body: `<p class="text-[13.5px] text-ink-soft leading-relaxed">${UI.escape(message)}</p>`,
      footer: `
        <button data-close class="btn btn-secondary">Cancel</button>
        <button id="confirmYes" class="btn btn-danger">Delete</button>
      `,
      onMount(root) {
        root.querySelector('#confirmYes').addEventListener('click', () => {
          UI.closeModal();
          onConfirm();
        });
      }
    });
  },
  gradeColor(grade) {
    if (grade === null || grade === undefined) return 'text-ink-muted';
    if (grade >= 90) return 'text-success-dark';
    if (grade >= 80) return 'text-primary-dark';
    if (grade >= 70) return 'text-ink';
    if (grade >= 60) return 'text-warning-dark';
    return 'text-danger-dark';
  },
  roleBadge(role) {
    const map = { admin: 'pill-warning', teacher: 'pill-primary', viewer: 'pill-neutral' };
    return `<span class="pill ${map[role]}">${role}</span>`;
  },
  statusPill(status) {
    const map = {
      active: 'pill-success',
      graduated: 'pill-primary',
      suspended: 'pill-danger',
    };
    return `<span class="pill ${map[status] || 'pill-neutral'}">${status}</span>`;
  },
  empty(title, hint) {
    return `
      <div class="text-center py-20 px-6">
        <div class="w-14 h-14 rounded-2xl bg-bg border border-line flex items-center justify-center mx-auto mb-4">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#98a2b3" stroke-width="1.6" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="M4 20l6-6"/>
          </svg>
        </div>
        <h3 class="text-[14px] text-ink font-medium mb-1.5">${UI.escape(title)}</h3>
        ${hint ? `<p class="text-[13px] text-ink-muted max-w-sm mx-auto">${UI.escape(hint)}</p>` : ''}
      </div>
    `;
  }
};

                      ${canGrade ? `
                        <button data-grade-enroll="${e.id}" class="btn btn-ghost !text-[12px] !px-3 !py-1.5 hover:!bg-primary-soft hover:!text-primary-dark">Grade</button>
                      ` : ''}
                      ${canDelete ? `
                        <button data-del-enroll="${e.id}" class="w-8 h-8 rounded-md text-ink-muted hover:text-danger hover:bg-danger-soft flex items-center justify-center transition-colors" title="Remove">
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
                        </button>
                      ` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    `;
  },

  attendance() {
    const selectedCourseId = this._attCourse || (DB.one('SELECT id FROM courses ORDER BY code')?.id);
    const selectedDate = this._attDate || new Date().toISOString().slice(0, 10);
    const courses = DB.all('SELECT id, code, title FROM courses ORDER BY code');

    if (!selectedCourseId) return `<div class="card">${UI.empty('No courses available', 'Add a course first from the Courses page.')}</div>`;

    const roster = DB.all(`
      SELECT e.id AS enrollment_id, s.student_id, s.first_name, s.last_name, a.status AS att_status
      FROM enrollments e
      JOIN students s ON e.student_id = s.id
      LEFT JOIN attendance a ON a.enrollment_id = e.id AND a.date = ?
      WHERE e.course_id = ?
      ORDER BY s.last_name
    `, [selectedDate, selectedCourseId]);

    const canMark = Auth.can('attendance.mark');
    const counts = { present: 0, absent: 0, late: 0, excused: 0 };
    roster.forEach(r => { if (r.att_status) counts[r.att_status]++; });

    return `
      <div class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-ink">Attendance</h1>
        <p class="text-[13.5px] text-ink-soft mt-1">Mark and track daily attendance per course</p>
      </div>

      <div class="card p-4 mb-4 grid sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-mono uppercase tracking-widest text-ink-muted mb-2">Course</label>
          <select id="attCourseSelect" class="input">
            ${courses.map(c => `<option value="${c.id}" ${c.id == selectedCourseId ? 'selected' : ''}>${UI.escape(c.code)} — ${UI.escape(c.title)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-mono uppercase tracking-widest text-ink-muted mb-2">Date</label>
          <input id="attDateInput" type="date" value="${selectedDate}" class="input">
        </div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        ${this._attStat('Present', counts.present, 'success')}
        ${this._attStat('Absent',  counts.absent,  'danger')}
        ${this._attStat('Late',    counts.late,    'warning')}
        ${this._attStat('Excused', counts.excused, 'neutral')}
      </div>

      ${roster.length === 0 ? `<div class="card">${UI.empty('No students enrolled', 'Enroll students in this course first.')}</div>` : `
        <div class="card overflow-hidden">
          <table class="text-[13.5px]">
            <thead class="bg-surface-soft text-[11px] font-mono uppercase tracking-wider text-ink-muted">
              <tr class="border-b border-line">
                <th class="text-left px-6 py-3">Student</th>
                <th class="text-left px-6 py-3">Status</th>
                <th class="text-right px-6 py-3">Mark</th>
              </tr>
            </thead>
            <tbody>
              ${roster.map(r => `
                <tr class="border-b border-line last:border-0 hover:bg-bg/50 transition-colors">
                  <td class="px-6 py-3.5">
                    <div class="text-ink font-medium">${UI.escape(r.first_name)} ${UI.escape(r.last_name)}</div>
                    <div class="text-[11.5px] text-ink-muted font-mono">${UI.escape(r.student_id)}</div>
                  </td>
                  <td class="px-6 py-3.5">
                    ${r.att_status
                      ? `<span class="pill pill-${r.att_status === 'present' ? 'success' : r.att_status === 'absent' ? 'danger' : r.att_status === 'late' ? 'warning' : 'neutral'} capitalize">${r.att_status}</span>`
                      : '<span class="text-[12px] text-ink-muted">Not marked</span>'}
                  </td>
                  <td class="px-6 py-3.5 text-right">
                    ${canMark ? `
                      <div class="inline-flex gap-1">
                        <button data-att="${r.enrollment_id}|present" class="btn btn-ghost !text-[12px] !px-3 !py-1.5 hover:!bg-success-soft hover:!text-success-dark">Present</button>
                        <button data-att="${r.enrollment_id}|absent"  class="btn btn-ghost !text-[12px] !px-3 !py-1.5 hover:!bg-danger-soft hover:!text-danger-dark">Absent</button>
                        <button data-att="${r.enrollment_id}|late"    class="btn btn-ghost !text-[12px] !px-3 !py-1.5 hover:!bg-warning-soft hover:!text-warning-dark">Late</button>
                        <button data-att="${r.enrollment_id}|excused" class="btn btn-ghost !text-[12px] !px-3 !py-1.5">Excused</button>
                      </div>
                    ` : '<span class="text-[12px] text-ink-muted">Read only</span>'}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    `;
  },

  _attStat(label, value, color) {
    const colors = {
      success: 'text-success-dark',
      danger: 'text-danger-dark',
      warning: 'text-warning-dark',
      neutral: 'text-ink-soft'
    };
    return `
      <div class="card p-4">
        <div class="text-[11px] font-mono uppercase tracking-widest text-ink-muted">${label}</div>
        <div class="text-2xl font-bold mt-2 tracking-tight tabular-nums ${colors[color]}">${value}</div>
      </div>
    `;
  },

  reports() {
    const tab = this._reportsTab || 'transcript';
    const students = DB.all('SELECT id, student_id, first_name, last_name FROM students ORDER BY last_name');
    const courses = DB.all('SELECT id, code, title FROM courses ORDER BY code');

    let content = '';

    if (tab === 'transcript') {
      const sid = this._reportsStudent || students[0]?.id;
      if (sid) {
        const student = DB.one(`
          SELECT s.*, d.name AS dept_name FROM students s
          JOIN departments d ON s.department_id = d.id WHERE s.id = ?
        `, [sid]);
        const rows = DB.all(`
          SELECT c.code, c.title, c.credits, e.grade, e.letter_grade
          FROM enrollments e JOIN courses c ON e.course_id = c.id
          WHERE e.student_id = ? ORDER BY c.code
        `, [sid]);
        const gpa = DB.one(`
          SELECT ROUND(SUM(c.credits * CASE
            WHEN e.grade >= 90 THEN 4.0 WHEN e.grade >= 80 THEN 3.0
            WHEN e.grade >= 70 THEN 2.0 WHEN e.grade >= 60 THEN 1.0
            ELSE 0.0 END) / NULLIF(SUM(c.credits), 0), 2) AS gpa,
            SUM(c.credits) AS credits, COUNT(*) AS courses
          FROM enrollments e JOIN courses c ON e.course_id = c.id
          WHERE e.student_id = ? AND e.grade IS NOT NULL
        `, [sid]);

        content = `
          <div class="flex items-center gap-4 mb-6 pb-6 border-b border-line">
            <div class="w-14 h-14 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-white font-semibold text-lg shrink-0">
              ${UI.escape(student.first_name[0] + student.last_name[0])}
            </div>
            <div class="flex-1">
              <h3 class="text-[16px] font-semibold text-ink">${UI.escape(student.first_name)} ${UI.escape(student.last_name)}</h3>
              <p class="text-[12px] text-ink-muted font-mono mt-0.5">${UI.escape(student.student_id)} · ${UI.escape(student.dept_name)} · Year ${student.year}</p>
            </div>
            <div class="text-right">
              <div class="text-[11px] font-mono uppercase tracking-widest text-ink-muted">Cumulative GPA</div>
              <div class="text-2xl font-bold text-primary-dark tracking-tight tabular-nums">${gpa.gpa ?? '—'}</div>
            </div>
          </div>

          ${rows.length === 0 ? UI.empty('No enrollments', 'This student is not enrolled in any course.') : `
            <table class="text-[13.5px]">
              <thead class="text-[11px] font-mono uppercase tracking-wider text-ink-muted">
                <tr class="border-b border-line">
                  <th class="text-left py-3">Course</th>
                  <th class="text-right py-3">Credits</th>
                  <th class="text-right py-3">Grade</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr class="border-b border-line last:border-0">
                    <td class="py-3.5">
                      <div class="text-ink text-[13px] font-medium">${UI.escape(r.title)}</div>
                      <div class="text-[11.5px] text-ink-muted font-mono">${UI.escape(r.code)}</div>
                    </td>
                    <td class="py-3.5 text-right text-ink-soft font-mono text-[12px] tabular-nums">${r.credits}</td>
                    <td class="py-3.5 text-right font-mono text-[12px] font-medium ${UI.gradeColor(r.grade)}">
                      ${r.grade !== null ? `${r.grade} · ${r.letter_grade}` : '<span class="text-ink-muted">—</span>'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot class="border-t-2 border-line">
                <tr>
                  <td class="py-3 text-ink-muted text-[11px] uppercase tracking-wider font-mono">Total</td>
                  <td class="py-3 text-right text-ink font-mono text-[12px] font-medium tabular-nums">${gpa.credits ?? 0} cr</td>
                  <td class="py-3 text-right text-ink font-mono text-[12px] font-medium tabular-nums">${gpa.courses ?? 0} courses</td>
                </tr>
              </tfoot>
            </table>
          `}
        `;
      }
    } else if (tab === 'gradebook') {
      const cid = this._reportsCourse || courses[0]?.id;
      if (cid) {
        const course = DB.one('SELECT * FROM courses WHERE id = ?', [cid]);
        const rows = DB.all(`
          SELECT s.student_id, s.first_name, s.last_name, e.grade, e.letter_grade
          FROM enrollments e JOIN students s ON e.student_id = s.id
          WHERE e.course_id = ? ORDER BY s.last_name
        `, [cid]);
        const stats = DB.one(`
          SELECT ROUND(AVG(grade),1) avg, MIN(grade) min, MAX(grade) max
          FROM enrollments WHERE course_id = ? AND grade IS NOT NULL
        `, [cid]);

        content = `
          <div class="flex items-end justify-between mb-6 pb-6 border-b border-line">
            <div>
              <h3 class="text-[16px] font-semibold text-ink">${UI.escape(course.title)}</h3>
              <p class="text-[12px] text-ink-muted font-mono mt-1">${UI.escape(course.code)} · ${course.credits} credits · ${course.semester}</p>
            </div>
            <div class="text-right">
              <div class="text-[11px] font-mono uppercase tracking-widest text-ink-muted">Class average</div>
              <div class="text-2xl font-bold text-primary-dark tracking-tight tabular-nums">${stats.avg ?? '—'}</div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="card p-4">
              <div class="text-[11px] font-mono uppercase tracking-widest text-ink-muted">Enrolled</div>
              <div class="text-xl font-bold mt-2 tabular-nums">${rows.length}</div>
            </div>
            <div class="card p-4">
              <div class="text-[11px] font-mono uppercase tracking-widest text-ink-muted">Highest</div>
              <div class="text-xl font-bold mt-2 text-success-dark tabular-nums">${stats.max ?? '—'}</div>
            </div>
            <div class="card p-4">
              <div class="text-[11px] font-mono uppercase tracking-widest text-ink-muted">Lowest</div>
              <div class="text-xl font-bold mt-2 text-warning-dark tabular-nums">${stats.min ?? '—'}</div>
            </div>
          </div>

          ${rows.length === 0 ? UI.empty('No enrollments') : `
            <table class="text-[13.5px]">
              <thead class="text-[11px] font-mono uppercase tracking-wider text-ink-muted">
                <tr class="border-b border-line">
                  <th class="text-left py-3">Student</th>
                  <th class="text-right py-3">Grade</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr class="border-b border-line last:border-0">
                    <td class="py-3.5">
                      <div class="text-ink text-[13px] font-medium">${UI.escape(r.first_name)} ${UI.escape(r.last_name)}</div>
                      <div class="text-[11.5px] text-ink-muted font-mono">${UI.escape(r.student_id)}</div>
                    </td>
                    <td class="py-3.5 text-right font-mono text-[12px] font-medium ${UI.gradeColor(r.grade)}">
                      ${r.grade !== null ? `${r.grade} · ${r.letter_grade}` : '<span class="text-ink-muted">—</span>'}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        `;
      }
    } else {
      const sql = this._sqlInput || '';
      const result = this._sqlResult;
      content = `
        <div class="mb-4">
          <label class="block text-[11px] font-mono uppercase tracking-widest text-ink-muted mb-2">Run SQL against the live database</label>
          <textarea id="sqlConsole" rows="4" spellcheck="false" placeholder="SELECT * FROM students LIMIT 10;"
            class="input font-mono !text-[12.5px] resize-y">${UI.escape(sql)}</textarea>
          <div class="flex items-center gap-3 mt-3">
            <button id="sqlRun" class="btn btn-primary">Run query</button>
            <span class="text-[11.5px] text-ink-muted font-mono">Try: SELECT * FROM students;</span>
          </div>
        </div>

        ${result ? `
          <div class="mt-4 space-y-3">
            ${result.error ? `
              <div class="bg-danger-soft border border-danger/30 rounded-lg p-4 text-danger-dark text-[12.5px] font-mono">
                ${UI.escape(result.error)}
              </div>
            ` : result.sets.length === 0 ? `
              <div class="bg-success-soft border border-success/30 rounded-lg p-4 text-success-dark text-[12.5px] font-mono">
                Statement executed. No rows returned.
              </div>
            ` : result.sets.map(set => `
              <div class="border border-line rounded-lg overflow-hidden">
                <table class="text-[12px]">
                  <thead class="bg-surface-soft font-mono uppercase tracking-wider text-ink-muted">
                    <tr class="border-b border-line">
                      ${set.columns.map(c => `<th class="text-left px-4 py-2.5">${UI.escape(c)}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${set.values.slice(0, 100).map(row => `
                      <tr class="border-b border-line last:border-0">
                        ${row.map(v => `<td class="px-4 py-2 text-ink font-mono tabular-nums">${v === null ? '<span class="text-ink-muted">NULL</span>' : UI.escape(v)}</td>`).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
                ${set.values.length > 100 ? `<div class="px-4 py-2 text-[11px] text-ink-muted border-t border-line">Showing first 100 of ${set.values.length} rows</div>` : ''}
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;
    }

    return `
      <div class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-ink">Reports</h1>
        <p class="text-[13.5px] text-ink-soft mt-1">Transcripts, gradebooks, and a live SQL console</p>
      </div>

      <div class="flex gap-1 mb-5 border-b border-line overflow-x-auto">
        ${this._tab('transcript', 'Student transcript', tab)}
        ${this._tab('gradebook',  'Course gradebook',   tab)}
        ${this._tab('sql',        'SQL console',        tab)}
      </div>

      ${tab === 'transcript' ? `
        <div class="mb-5">
          <select id="reportsStudent" class="input !w-auto">
            ${students.map(s => `<option value="${s.id}" ${s.id == this._reportsStudent ? 'selected' : ''}>${UI.escape(s.student_id)} — ${UI.escape(s.first_name)} ${UI.escape(s.last_name)}</option>`).join('')}
          </select>
        </div>
      ` : ''}

      ${tab === 'gradebook' ? `
        <div class="mb-5">
          <select id="reportsCourse" class="input !w-auto">
            ${courses.map(c => `<option value="${c.id}" ${c.id == this._reportsCourse ? 'selected' : ''}>${UI.escape(c.code)} — ${UI.escape(c.title)}</option>`).join('')}
          </select>
        </div>
      ` : ''}

      <div class="card p-6">${content}</div>
    `;
  },

  _tab(id, label, active) {
    const isActive = id === active;
    return `<button data-reports-tab="${id}" class="px-4 py-2.5 text-[13.5px] font-medium transition-colors border-b-2 -mb-px whitespace-nowrap ${
      isActive ? 'text-primary-dark border-primary' : 'text-ink-soft border-transparent hover:text-ink'
    }">${UI.escape(label)}</button>`;
  }
};

const App = {
  currentView: 'dashboard',

  render() {
    document.getElementById('nav').innerHTML = NAV.map(item => `
      <a href="#" data-view="${item.id}" class="nav-item ${this.currentView === item.id ? 'active' : ''}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${item.icon}</svg>
        ${UI.escape(item.label)}
      </a>
    `).join('');

    const user = Auth.current;
    document.getElementById('userCard').innerHTML = `
      <div class="flex items-center gap-2.5 p-2 rounded-lg bg-bg">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-primary-dark flex items-center justify-center text-white font-semibold text-[12px] shrink-0">
          ${UI.escape(user.name[0])}
        </div>
        <div class="min-w-0 flex-1">
          <div class="text-[12.5px] text-ink font-medium truncate">${UI.escape(user.name)}</div>
          <div class="text-[10.5px] text-ink-muted font-mono truncate">@${UI.escape(user.username)}</div>
        </div>
      </div>
      <div class="mt-2.5 flex items-center justify-between">
        ${UI.roleBadge(user.role)}
        <button id="logoutBtn" class="text-[11.5px] text-ink-muted hover:text-ink transition-colors font-medium">Sign out</button>
      </div>
    `;

    const current = NAV.find(n => n.id === this.currentView);
    document.getElementById('breadcrumb').textContent = current ? current.label : '';

    document.getElementById('main').innerHTML = Views[this.currentView] ? Views[this.currentView]() : UI.empty('Not found');
    this.bind();
  },

  navigate(view) {
    if (!Views[view]) return;
    this.currentView = view;
    this.render();
  },

  bind() {
    document.querySelectorAll('[data-view]').forEach(el => {
      el.addEventListener('click', e => { e.preventDefault(); this.navigate(el.dataset.view); });
    });

    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      Auth.logout();
      document.getElementById('app').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('loginScreen').classList.add('flex');
    });

    document.getElementById('studentSearch')?.addEventListener('input', e => {
      Views._studentsSearch = e.target.value;
      clearTimeout(this._searchTimer);
      this._searchTimer = setTimeout(() => this.render(), 200);
    });
    document.getElementById('studentDept')?.addEventListener('change', e => {
      Views._studentsDept = e.target.value;
      this.render();
    });

    document.getElementById('newStudentBtn')?.addEventListener('click', () => this.studentForm());
    document.querySelectorAll('[data-edit-student]').forEach(el => {
      el.addEventListener('click', () => this.studentForm(parseInt(el.dataset.editStudent, 10)));
    });
    document.querySelectorAll('[data-del-student]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.delStudent, 10);
        const s = DB.one('SELECT * FROM students WHERE id = ?', [id]);
        UI.confirm(`Delete ${s.first_name} ${s.last_name}? This will also remove their enrollments and attendance.`, () => {
          DB.run('DELETE FROM students WHERE id = ?', [id]);
          UI.toast('Student deleted', 'success');
          this.render();
        });
      });
    });

    document.getElementById('newCourseBtn')?.addEventListener('click', () => this.courseForm());
    document.querySelectorAll('[data-edit-course]').forEach(el => {
      el.addEventListener('click', () => this.courseForm(parseInt(el.dataset.editCourse, 10)));
    });
    document.querySelectorAll('[data-del-course]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.delCourse, 10);
        const c = DB.one('SELECT * FROM courses WHERE id = ?', [id]);
        UI.confirm(`Delete "${c.title}"? This will remove all enrollments in this course.`, () => {
          DB.run('DELETE FROM courses WHERE id = ?', [id]);
          UI.toast('Course deleted', 'success');
          this.render();
        });
      });
    });

    document.getElementById('newEnrollBtn')?.addEventListener('click', () => this.enrollmentForm());
    document.querySelectorAll('[data-grade-enroll]').forEach(el => {
      el.addEventListener('click', () => this.gradeForm(parseInt(el.dataset.gradeEnroll, 10)));
    });
    document.querySelectorAll('[data-del-enroll]').forEach(el => {
      el.addEventListener('click', () => {
        const id = parseInt(el.dataset.delEnroll, 10);
        UI.confirm('Remove this enrollment?', () => {
          DB.run('DELETE FROM enrollments WHERE id = ?', [id]);
          UI.toast('Enrollment removed', 'success');
          this.render();
        });
      });
    });

    document.getElementById('attCourseSelect')?.addEventListener('change', e => {
      Views._attCourse = parseInt(e.target.value, 10);
      this.render();
    });
    document.getElementById('attDateInput')?.addEventListener('change', e => {
      Views._attDate = e.target.value;
      this.render();
    });
    document.querySelectorAll('[data-att]').forEach(el => {
      el.addEventListener('click', () => {
        const [eid, status] = el.dataset.att.split('|');
        const date = Views._attDate || new Date().toISOString().slice(0, 10);
        DB.run('INSERT OR REPLACE INTO attendance (enrollment_id, date, status) VALUES (?, ?, ?)', [parseInt(eid, 10), date, status]);
        UI.toast(`Marked ${status}`, 'success');
        this.render();
      });
    });

    document.querySelectorAll('[data-reports-tab]').forEach(el => {
      el.addEventListener('click', () => { Views._reportsTab = el.dataset.reportsTab; this.render(); });
    });
    document.getElementById('reportsStudent')?.addEventListener('change', e => {
      Views._reportsStudent = parseInt(e.target.value, 10); this.render();
    });
    document.getElementById('reportsCourse')?.addEventListener('change', e => {
      Views._reportsCourse = parseInt(e.target.value, 10); this.render();
    });
    document.getElementById('sqlRun')?.addEventListener('click', () => {
      const sql = document.getElementById('sqlConsole').value.trim();
      if (!sql) return;
      Views._sqlInput = sql;
      try {
        const sets = DB.exec(sql);
        Views._sqlResult = { sets: sets.map(s => ({ columns: s.columns, values: s.values })), error: null };
        if (sets.length === 0) UI.toast('Query executed — no rows', 'success');
        else UI.toast(`Returned ${sets[0].values.length} row${sets[0].values.length === 1 ? '' : 's'}`, 'success');
      } catch (err) {
        Views._sqlResult = { sets: [], error: err.message };
        UI.toast('SQL error', 'error');
      }
      this.render();
    });
  },

  studentForm(id) {
    const editing = id !== undefined;
    const s = editing ? DB.one('SELECT * FROM students WHERE id = ?', [id]) : null;
    const departments = DB.all('SELECT * FROM departments ORDER BY name');

    UI.modal({
      title: editing ? 'Edit student' : 'New student',
      body: `
        <form id="studentForm" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Student ID</label>
              <input name="student_id" required value="${UI.escape(s?.student_id || '')}" placeholder="STU-2025-011" class="input font-mono">
            </div>
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Status</label>
              <select name="status" class="input">
                ${['active', 'graduated', 'suspended'].map(v => `<option value="${v}" ${s?.status === v ? 'selected' : ''}>${v}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">First name</label>
              <input name="first_name" required value="${UI.escape(s?.first_name || '')}" class="input">
            </div>
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Last name</label>
              <input name="last_name" required value="${UI.escape(s?.last_name || '')}" class="input">
            </div>
          </div>
          <div>
            <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Email</label>
            <input name="email" type="email" required value="${UI.escape(s?.email || '')}" class="input">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Phone</label>
              <input name="phone" value="${UI.escape(s?.phone || '')}" placeholder="+251…" class="input font-mono">
            </div>
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Year</label>
              <input name="year" type="number" min="1" max="5" required value="${s?.year || 1}" class="input font-mono">
            </div>
          </div>
          <div>
            <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Department</label>
            <select name="department_id" required class="input">
              ${departments.map(d => `<option value="${d.id}" ${s?.department_id === d.id ? 'selected' : ''}>${UI.escape(d.name)}</option>`).join('')}
            </select>
          </div>
        </form>
      `,
      footer: `
        <button data-close class="btn btn-secondary">Cancel</button>
        <button id="studentSave" class="btn btn-primary">${editing ? 'Save changes' : 'Create student'}</button>
      `,
      onMount(root) {
        root.querySelector('#studentSave').addEventListener('click', () => {
          const fd = new FormData(root.querySelector('#studentForm'));
          const data = Object.fromEntries(fd);
          data.department_id = parseInt(data.department_id, 10);
          data.year = parseInt(data.year, 10);
          if (!editing) data.enrolled_date = new Date().toISOString().slice(0, 10);
          try {
            if (editing) {
              DB.run(`UPDATE students SET student_id=?, first_name=?, last_name=?, email=?, phone=?, department_id=?, year=?, status=? WHERE id=?`,
                [data.student_id, data.first_name, data.last_name, data.email, data.phone, data.department_id, data.year, data.status, id]);
              UI.toast('Student updated', 'success');
            } else {
              DB.run(`INSERT INTO students (student_id, first_name, last_name, email, phone, department_id, year, enrolled_date, status) VALUES (?,?,?,?,?,?,?,?,?)`,
                [data.student_id, data.first_name, data.last_name, data.email, data.phone, data.department_id, data.year, data.enrolled_date, data.status]);
              UI.toast('Student created', 'success');
            }
            UI.closeModal();
            App.render();
          } catch (err) {
            UI.toast(err.message.includes('UNIQUE') ? 'Student ID or email already exists' : err.message, 'error');
          }
        });
      }
    });
  },

  courseForm(id) {
    const editing = id !== undefined;
    const c = editing ? DB.one('SELECT * FROM courses WHERE id = ?', [id]) : null;
    const departments = DB.all('SELECT * FROM departments ORDER BY name');

    UI.modal({
      title: editing ? 'Edit course' : 'New course',
      body: `
        <form id="courseForm" class="space-y-4">
          <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Course code</label>
              <input name="code" required value="${UI.escape(c?.code || '')}" placeholder="WDD-XXX" class="input font-mono">
            </div>
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Credits</label>
              <input name="credits" type="number" min="1" max="6" required value="${c?.credits || 3}" class="input font-mono">
            </div>
          </div>
          <div>
            <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Title</label>
            <input name="title" required value="${UI.escape(c?.title || '')}" class="input">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Department</label>
              <select name="department_id" required class="input">
                ${departments.map(d => `<option value="${d.id}" ${c?.department_id === d.id ? 'selected' : ''}>${UI.escape(d.name)}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Semester</label>
              <input name="semester" required value="${UI.escape(c?.semester || '')}" placeholder="2025-Fall" class="input font-mono">
            </div>
          </div>
        </form>
      `,
      footer: `
        <button data-close class="btn btn-secondary">Cancel</button>
        <button id="courseSave" class="btn btn-primary">${editing ? 'Save changes' : 'Create course'}</button>
      `,
      onMount(root) {
        root.querySelector('#courseSave').addEventListener('click', () => {
          const fd = new FormData(root.querySelector('#courseForm'));
          const data = Object.fromEntries(fd);
          data.department_id = parseInt(data.department_id, 10);
          data.credits = parseInt(data.credits, 10);
          try {
            if (editing) {
              DB.run(`UPDATE courses SET code=?, title=?, department_id=?, credits=?, semester=? WHERE id=?`,
                [data.code, data.title, data.department_id, data.credits, data.semester, id]);
              UI.toast('Course updated', 'success');
            } else {
              DB.run(`INSERT INTO courses (code, title, department_id, credits, semester) VALUES (?,?,?,?,?)`,
                [data.code, data.title, data.department_id, data.credits, data.semester]);
              UI.toast('Course created', 'success');
            }
            UI.closeModal();
            App.render();
          } catch (err) {
            UI.toast(err.message.includes('UNIQUE') ? 'Course code already exists' : err.message, 'error');
          }
        });
      }
    });
  },

  enrollmentForm() {
    const students = DB.all('SELECT id, student_id, first_name, last_name FROM students WHERE status = "active" ORDER BY last_name');
    const courses = DB.all('SELECT id, code, title FROM courses ORDER BY code');

    UI.modal({
      title: 'Enroll student in a course',
      body: `
        <form id="enrollForm" class="space-y-4">
          <div>
            <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Student</label>
            <select name="student_id" required class="input">
              ${students.map(s => `<option value="${s.id}">${UI.escape(s.student_id)} — ${UI.escape(s.first_name)} ${UI.escape(s.last_name)}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Course</label>
            <select name="course_id" required class="input">
              ${courses.map(c => `<option value="${c.id}">${UI.escape(c.code)} — ${UI.escape(c.title)}</option>`).join('')}
            </select>
          </div>
        </form>
      `,
      footer: `
        <button data-close class="btn btn-secondary">Cancel</button>
        <button id="enrollSave" class="btn btn-primary">Enroll</button>
      `,
      onMount(root) {
        root.querySelector('#enrollSave').addEventListener('click', () => {
          const fd = new FormData(root.querySelector('#enrollForm'));
          const student_id = parseInt(fd.get('student_id'), 10);
          const course_id = parseInt(fd.get('course_id'), 10);
          try {
            DB.run(`INSERT INTO enrollments (student_id, course_id, enrolled_at) VALUES (?,?,?)`,
              [student_id, course_id, new Date().toISOString().slice(0, 10)]);
            UI.toast('Student enrolled', 'success');
            UI.closeModal();
            App.render();
          } catch (err) {
            UI.toast(err.message.includes('UNIQUE') ? 'This student is already enrolled in that course' : err.message, 'error');
          }
        });
      }
    });
  },

  gradeForm(id) {
    const e = DB.one(`
      SELECT e.*, s.first_name, s.last_name, c.code, c.title
      FROM enrollments e
      JOIN students s ON e.student_id = s.id
      JOIN courses c ON e.course_id = c.id
      WHERE e.id = ?`, [id]);
    if (!e) return;

    UI.modal({
      title: 'Enter grade',
      body: `
        <div class="mb-4 p-3 bg-bg rounded-lg">
          <div class="text-[13.5px] text-ink font-medium">${UI.escape(e.first_name)} ${UI.escape(e.last_name)}</div>
          <div class="text-[11.5px] font-mono text-ink-muted mt-1">${UI.escape(e.code)} — ${UI.escape(e.title)}</div>
        </div>
        <form id="gradeForm">
          <label class="block text-[10.5px] font-mono uppercase tracking-widest text-ink-muted mb-2">Grade (0 – 100)</label>
          <input name="grade" type="number" min="0" max="100" step="0.5" value="${e.grade ?? ''}" required class="input font-mono">
          <p class="text-[11.5px] text-ink-muted mt-2">Letter grade is computed automatically: A ≥ 90, B ≥ 80, C ≥ 70, D ≥ 60, F below.</p>
        </form>
      `,
      footer: `
        <button data-close class="btn btn-secondary">Cancel</button>
        <button id="gradeSave" class="btn btn-primary">Save grade</button>
      `,
      onMount(root) {
        root.querySelector('#gradeSave').addEventListener('click', () => {
          const val = parseFloat(root.querySelector('[name=grade]').value);
          if (isNaN(val) || val < 0 || val > 100) { UI.toast('Grade must be between 0 and 100', 'error'); return; }
          DB.run('UPDATE enrollments SET grade = ?, letter_grade = ? WHERE id = ?', [val, DB.letterGrade(val), id]);
          UI.toast('Grade saved', 'success');
          UI.closeModal();
          App.render();
        });
      }
    });
  }
};

(async function boot() {
  try {
    await DB.init();

    document.querySelectorAll('[data-fill]').forEach(btn => {
      btn.addEventListener('click', () => {
        const [u, p] = btn.dataset.fill.split(':');
        document.getElementById('loginUser').value = u;
        document.getElementById('loginPass').value = p;
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      const res = await Auth.login(user, pass);
      if (!res.ok) {
        errEl.textContent = res.error;
        errEl.classList.remove('hidden');
        return;
      }
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('flex');
      document.getElementById('app').classList.remove('hidden');
      App.render();
      UI.toast(`Signed in as ${Auth.current.name}`, 'success');
    });

    document.getElementById('resetDbBtn').addEventListener('click', () => {
      if (!Auth.can('db.reset')) { UI.toast('Only administrators can reset the database', 'error'); return; }
      UI.confirm('Reset the database? All changes will be lost and seed data will be restored.', () => {
        DB.reset().then(() => {
          UI.toast('Database reset to seed data', 'success');
          App.render();
        });
      });
    });

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('loginScreen').classList.add('flex');

  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML = `
      <div class="text-center max-w-md">
        <div class="text-danger text-sm font-mono">Failed to initialize database</div>
        <div class="text-xs text-ink-muted mt-2">${UI.escape(err.message)}</div>
      </div>
    `;
  }
})();
</script>

</body>
</html>
